<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="course.css">
    <title>Document</title>
</head>
<body>
    <div id="nav"></div>
    <main>
        <div class="image">
            <div class="overlay">

                <h1>Our Courses</h1>
                <p>Home/Course</p>
            </div>

        </div>
        <div class="search">
            <div class="search-box">
                <div class="input">
                    <input type="text" placeholder="Search Course">
                </div>
                <div class="icon">
                    <i class="fa-brands fa-sistrix"></i>
                </div>
            </div>
        </div>
        <div class="box">
            <button>All Course</button>
            <button>Development</button>
            <button>Design</button>
            <button>Marketing</button>
        </div>  
        <div class="courses">
            <div class="course">
                <div class="img">
                    <img src="image/p1.avif" alt="">
                </div>
                <div class="title">
                    <h3>Full-Stack Web Development Bootcamp</h3>
                </div>
                <div class="price">
                    $200
                </div>
                <div class="description">
                    <p>Build responsive websites from scratch using HTML, CSS, JavaScript, and modern frameworks.</p>
                </div>
                <button onclick="addCart('Full-Stack Web Development Bootcamp',200)">Buy</button>
            </div>
        </div>
    </main>
    <div id="footer"></div>
    <script>
const jsonString = '{"name": "John", "age": 30}';
const userObj = JSON.parse(jsonString);
        console.log(jsonString  )
        function addCart(title, price) {
            let existingProduct = JSON.parse(localStorage.getItem('product')) || [];
            let item = {
                title: title,
                price: price
            }
            existingProduct.push(item)
            localStorage.setItem('product',JSON.stringify(existingProduct));
        }
    </script>
</body>
</html>
