<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Courses</title>
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="course.css">
</head>
<body>
    <div id="nav"></div>

    <main>
        <!-- Hero Section -->
        <div class="hero-image">
            <div class="overlay">
                <h1>Our Courses</h1>
                <p>Home / Course</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" placeholder="Search Course...">
                <button class="search-icon-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>

        <!-- Filter Categories -->
        <div class="filter-box">
            <button class="btn-filter active">All Courses</button>
            <button class="btn-filter">Development</button>
            <button class="btn-filter">Design</button>
            <button class="btn-filter">Marketing</button>
            <a href="cart.html" class="btn-view-cart"><i class="fa-solid fa-cart-shopping"></i> View Cart</a>
        </div>  

        <!-- Courses Grid -->
        <div class="courses-container">
            <!-- Course Card 1 -->
            <div class="course-card">
                <div class="course-img">
                    <img src="https://images.unsplash.com/photo-1618401471353-b98afee0b2eb?q=80&w=500" alt="Web Dev">
                </div>
                <div class="course-content">
                    <span class="badge">Development</span>
                    <h3>Full-Stack Web Development Bootcamp</h3>
                    <p class="description">Build responsive websites from scratch using HTML, CSS, JavaScript, and modern frameworks.</p>
                    <div class="card-footer">
                        <span class="price">$200</span>
                        <button class="btn-buy" onclick="addCart('Full-Stack Web Development Bootcamp', 200, 'https://images.unsplash.com/photo-1618401471353-b98afee0b2eb?q=80&w=500')">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script>
        function addCart(title, price, img) {
            let existingProduct = JSON.parse(localStorage.getItem('product')) || [];

            let exists = existingProduct.filter(item => item.title === title);
            console.log(exists.length)
            if(!exists.length == 0) {
                alert("This course is already in your cart")
                return
            }
            let item = {
                title: title,
                price: price,
                img: img
            }
            existingProduct.push(item);
            localStorage.setItem('product', JSON.stringify(existingProduct));
             alert(`${title} added to cart!`);
        }

        $(document).ready(function() {
            $("#nav").load("nav.html");
            $("#footer").load("footer.html");
        });
    </script>
</body>
</html>
