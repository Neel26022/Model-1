<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <title>Contact Page</title>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <div id="nav"></div>
  <div class="map-section">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3308.594690212698!2d-118.083626!3d34.080565!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c2d0c95f1f6d5b%3A0x9a3fbd53d6bfa3f0!2sRosemead%2C%20CA%2091770!5e0!3m2!1sen!2sus!4v1710000000000!5m2!1sen!2sus"
      width="100%"
      height="450"
      style="border:0;"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </div>

  <div class="contact-section">

    <div class="contact-left">

      <h2>Get in Touch</h2>

      <div class="info-box">
        <p>
          <i class="fa-regular fa-lightbulb"></i>
          Before you reach out, check our resources:
        </p>

        <button>Frequently Asked Questions</button>
        <button>Pricing and Plans</button>
        <button>Browse Our Courses</button>
      </div>

      <form>

        <textarea placeholder="Enter Message"></textarea>

        <div class="row">
          <input type="text" placeholder="Enter your name">
          <input type="email" placeholder="Enter email address">
        </div>

        <input type="text" placeholder="Enter Subject">

        <select>
          <option>Select Department</option>
          <option>Support</option>
          <option>Sales</option>
          <option>Technical</option>
        </select>

        <button type="submit" class="send-btn">
          SEND MESSAGE
        </button>

      </form>

    </div>

    <!-- RIGHT SIDE -->
    <div class="contact-right">

      <div class="contact-item">
        <i class="fa-solid fa-house"></i>

        <div>
          <h4>1200 Rosemead Blvd</h4>
          <p>Rosemead, CA 91770</p>
        </div>
      </div>

      <div class="contact-item">
        <i class="fa-solid fa-mobile-screen"></i>

        <div>
          <h4>+1 (440) 986-5562</h4>
          <p>Mon to Fri 9am to 6pm PST</p>
        </div>
      </div>

      <div class="contact-item">
        <i class="fa-regular fa-envelope"></i>

        <div>
          <h4>support@etrain.edu</h4>
          <p>We typically respond within 24 hours</p>
        </div>
      </div>

      <div class="response-box">
        <h4>Response Time</h4>
        <p>We respond within 24 hours on business days</p>
      </div>

    </div>

  </div>
  <div id="footer"></div>
  <script>
    $(document).ready(function() {
      $("#nav").load("nav.html")
      $("#footer").load("footer.html")
    })
  </script>
</body>
</html>
